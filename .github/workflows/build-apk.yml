          node patch_fix88.js
          node patch_fix89.js
          node patch_fix82.js
          node patch_fix62.js
          grep -n "val gap = dp" app/src/main/java/io/github/jackwener/dsh/service/FloatingBallService.kt
          grep -c "tableComponent" app/src/main/java/io/github/jackwener/dsh/core/designsystem/Content.kt
          grep -c "prov_model_remove" app/src/main/res/values/strings.xml
          grep -c "deep_diving_steps" app/src/main/java/io/github/jackwener/dsh/feature/conversation/Stream.kt
          grep -c "verticalScroll" app/src/main/java/io/github/jackwener/dsh/feature/extensions/SkillsTab.kt
          grep -c "isScrollInProgress) follow = false" app/src/main/java/io/github/jackwener/dsh/feature/conversation/Stream.kt
          grep -c "!writtenThisTurn -> TodoDockMode.Hidden" app/src/main/java/io/github/jackwener/dsh/core/session/Projection.kt
          grep -c "widening schedule" app/src/main/java/io/github/jackwener/dsh/feature/conversation/Stream.kt
          grep -c "lastPaneHeight" app/src/main/java/io/github/jackwener/dsh/feature/conversation/Stream.kt
          test ! -d app/src/main/res/values-ru
          grep -c locale app/src/main/res/xml/locales_config.xml
          grep -c copyPageOpen app/src/main/java/io/github/jackwener/dsh/feature/conversation/HomeScreen.kt
          grep -c splashHold app/src/main/java/io/github/jackwener/dsh/MainActivity.kt
          grep -c codeCopyHit app/src/main/java/io/github/jackwener/dsh/core/designsystem/Content.kt
          grep -c screen_collect app/src/main/java/io/github/jackwener/dsh/core/capability/tools/ScreenTools.kt
          grep -c browserOpen app/src/main/java/io/github/jackwener/dsh/feature/conversation/HomeScreen.kt
          grep -c "BrowserSession" app/src/main/java/io/github/jackwener/dsh/core/capability/tools/BrowserTools.kt
          grep -c browser_title app/src/main/res/values/strings.xml
          grep -c browser-globe-always app/src/main/java/io/github/jackwener/dsh/feature/conversation/HomeScreen.kt
          grep -c browser_home_hint app/src/main/res/values/strings.xml
          grep -c ic_home app/src/main/java/io/github/jackwener/dsh/feature/browser/BrowserPage.kt
          test -f app/src/main/res/drawable/ic_home.xml
          grep -c BookmarkStore app/src/main/java/io/github/jackwener/dsh/feature/browser/BrowserPage.kt
          grep -c "browser_tabs" app/src/main/res/values/strings.xml
          grep -c "browser_agent_busy" app/src/main/res/values/strings.xml
          grep -c stop-hard app/src/main/java/io/github/jackwener/dsh/core/engine/EngineManager.kt
          grep -c resume-all app/src/main/java/io/github/jackwener/dsh/feature/extensions/ExtensionsScreen.kt
          grep -c usage-cost-cell app/src/main/java/io/github/jackwener/dsh/feature/settings/UsageSection.kt
          grep -c ball-look app/src/main/java/io/github/jackwener/dsh/service/FloatingBallService.kt
          grep -c ball_look_setting app/src/main/res/values/strings.xml
          grep -c "fun LiveDot" app/src/main/java/io/github/jackwener/dsh/core/designsystem/Primitives.kt
          grep -c "browser-live-dot" app/src/main/java/io/github/jackwener/dsh/core/capability/CapabilityHub.kt
          grep -c "browser-speed" app/src/main/java/io/github/jackwener/dsh/core/capability/tools/BrowserTools.kt
          grep -c "browser-stable-ref" app/src/main/java/io/github/jackwener/dsh/core/capability/tools/BrowserTools.kt
          grep -c "bookmark-reorder" app/src/main/java/io/github/jackwener/dsh/feature/browser/BrowserPage.kt
          grep -c "browser-ergonomics" app/src/main/java/io/github/jackwener/dsh/feature/browser/BrowserPage.kt
          grep -c "browser-close-chevron" app/src/main/java/io/github/jackwener/dsh/feature/browser/BrowserPage.kt
          grep -c "browser-home-tool" app/src/main/java/io/github/jackwener/dsh/core/capability/tools/BrowserTools.kt
          grep -c "browser_home" app/src/main/java/io/github/jackwener/dsh/core/capability/tools/BrowserTools.kt
          grep -c chat-identity app/src/main/java/io/github/jackwener/dsh/feature/conversation/Stream.kt
          grep -c chat-identity app/src/main/java/io/github/jackwener/dsh/feature/settings/SettingsScreen.kt
          grep -c set_preference app/src/main/res/values/strings.xml
          grep -c chat-look app/src/main/java/io/github/jackwener/dsh/core/data/UiPrefs.kt
          grep -c chat_look_name app/src/main/res/values/strings.xml
          grep -c show_stamp app/src/main/java/io/github/jackwener/dsh/core/data/SettingsRepository.kt
          grep -c showCopy app/src/main/java/io/github/jackwener/dsh/feature/conversation/Stream.kt
          grep -c empty-send app/src/main/java/io/github/jackwener/dsh/core/session/SessionStore.kt
          grep -c avatar-beside app/src/main/java/io/github/jackwener/dsh/feature/conversation/Stream.kt
          grep -c chat-avatar-up app/src/main/java/io/github/jackwener/dsh/feature/settings/SettingsScreen.kt
          grep -c safe-quiet app/src/main/java/io/github/jackwener/dsh/core/engine/RestartPolicy.kt
          grep -c safe-quiet app/src/main/java/io/github/jackwener/dsh/core/engine/EngineManager.kt
          grep -c notif_safe_mode_title app/src/main/res/values/strings.xml
          grep -c show_user_avatar app/src/main/java/io/github/jackwener/dsh/core/data/SettingsRepository.kt
          grep -c "browser-live-dot-turn" app/src/main/java/io/github/jackwener/dsh/core/session/SessionStore.kt
          grep -c "notes-export" app/src/main/java/io/github/jackwener/dsh/feature/settings/BackupPage.kt
          grep -c copy_page_title app/src/main/res/values/strings.xml
          grep -c folder_order app/src/main/res/values/strings.xml
          grep -c folder-order-dialog app/src/main/java/io/github/jackwener/dsh/feature/conversation/SessionDrawer.kt
          grep -c "browser-dark" app/src/main/java/io/github/jackwener/dsh/core/capability/BrowserSession.kt
          grep -c "Theme.Dsh.WebDark" app/src/main/res/values/themes.xml
          grep -c "BrowserSession.setDark" app/src/main/java/io/github/jackwener/dsh/MainActivity.kt

      - name: 检查更新指向自己的仓库 + 版本号
        if: ${{ inputs.app_id != '' }}
        run: |
          set -euo pipefail
          node patch_update.js app/src/main/java/io/github/jackwener/dsh/core/update/UpdateManifest.kt app/build.gradle.kts "${{ github.repository }}" "$VC" "$NVER"
          grep -n "private const val REPO\|versionCode" app/src/main/java/io/github/jackwener/dsh/core/update/UpdateManifest.kt app/build.gradle.kts

      - name: 固定签名 keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > release.keystore
            echo "keystore: from repo secret"
          else
            keytool -genkeypair -v -keystore release.keystore -alias dsh -keyalg RSA -keysize 2048 -validity 10950 -storepass dshkcc2026 -keypass dshkcc2026 -dname "CN=DSH, OU=kcc, O=kyabetsu, C=CN"
            base64 -w0 release.keystore > signing-key.b64
            echo "GENERATED_KEYSTORE=1" >> "$GITHUB_ENV"
            echo "keystore: NEW generated (set repo secret ANDROID_KEYSTORE_B64 with signing-key.b64)"
          fi

      - name: 编译
        continue-on-error: false
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease -Pdsh.signing.storeFile="$PWD/release.keystore" -Pdsh.signing.storePassword=dshkcc2026 -Pdsh.signing.keyAlias=dsh -Pdsh.signing.keyPassword=dshkcc2026 -Pdsh.nativeOut="$PWD/toolchains/out/jniLibs" -Pdsh.engineOut="$PWD/toolchains/out/engine" -Pdsh.thirdPartyOut="$PWD/toolchains/out/third-party" -Pdsh.fetchShizuku=false 2>&1 | tee build-error.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-error
          path: build-error.log
          if-no-files-found: ignore
      - name: 发布 Release + 更新清单
        if: ${{ inputs.app_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$NVER"
          NAME="DSH-Android-$VER.apk"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "$NAME"
          SIZE=$(stat -c%s "$NAME")
          SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          CERT=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$NAME" | grep -oP 'certificate SHA-256 digest: \K[0-9a-f]{64}' | head -1)
          [ -n "$CERT" ] || { echo "no signer cert"; exit 1; }
          cat > update.json <<EOF
          {"format":1,"packageName":"${{ inputs.app_id }}","versionCode":$VC,"versionName":"$VER","minSdk":29,"apk":{"name":"$NAME","size":$SIZE,"sha256":"$SHA","urls":["https://github.com/${{ github.repository }}/releases/download/$RTAG/$NAME"]},"signerSha256":"$CERT","notes":{"zh":"kcc 构建：悬浮球/动画/气泡优化。","en":"kcc build."},"publishedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          gh release create "$RTAG" "$NAME" update.json --title "$RTAG" --notes "kcc $VER" --latest
          mkdir -p update && cp update.json update/latest.json
          SHAJ=$(gh api "repos/${{ github.repository }}/contents/update/latest.json" --jq '.sha' 2>/dev/null || true)
          if [ -n "$SHAJ" ]; then
            gh api --method PUT "repos/${{ github.repository }}/contents/update/latest.json" -f message="update manifest $RTAG" -f content="$(base64 -w0 update/latest.json)" -f branch=main -f sha="$SHAJ" --silent
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/update/latest.json" -f message="update manifest $RTAG" -f content="$(base64 -w0 update/latest.json)" -f branch=main --silent
          fi
          echo "released $RTAG  sha256=$SHA  signer=$CERT"

      - uses: actions/upload-artifact@v4
        if: env.GENERATED_KEYSTORE == '1'
        with:
          name: signing-key
          path: signing-key.b64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-kcc-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
